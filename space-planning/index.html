<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Blocker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.habitat.sketchup.com/dist/sketchup-js-api/v2/sketchup-js-api.min.js"></script>
</head>
<body>
  <h1>Room Blocker</h1>
  <p>Blocks out a room as a named group.</p>

  <label>Width (ft) <input id="width" type="number" value="12" min="1" step="0.5"></label>
  <label>Depth (ft) <input id="depth" type="number" value="10" min="1" step="0.5"></label>
  <label>Height (ft) <input id="height" type="number" value="9" min="1" step="0.5"></label>
  <label>Name <input id="name" type="text" value="Room" style="width: 8em"></label>

  <button id="create" disabled>Create room</button>
  <button id="ask">Ask with a SketchUp dialog…</button>

  <p id="status">Connecting…</p>
  <script src="app.js"></script>
</body>
</html>
